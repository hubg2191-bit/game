services:
  game:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # внутри compose — имена сервисов, а не localhost
      DB_URL: postgres://tt:${POSTGRES_PASSWORD:-tt}@postgres:5432/tt
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tt}
      POSTGRES_DB: tt
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
